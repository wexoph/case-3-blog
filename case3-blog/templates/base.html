<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} — {{ appname }}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><strong>{{ appname }}</strong><a href="{{ url_for('index') }}">Главная</a>{% if current_user %}<a href="{{ url_for('profile',username=current_user['username']) }}">Мой профиль</a><span class="muted">{{ current_user['username'] }}</span><a href="{{ url_for('logout') }}">Выйти</a>{% else %}<a href="{{ url_for('login') }}">Войти</a><a href="{{ url_for('register') }}">Регистрация</a>{% endif %}</header><main><h1>{{ title }}</h1>{% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}{{ body|safe }}</main><footer>Учебный локальный проект · данные хранятся в SQLite на этом компьютере</footer></body></html>
